# kind = "Kubernetes IN Docker": each NODE is a container running a full
# kubelet. A real multi-node cluster on one machine, in seconds, with no cloud
# account — which is why it's the standard local testing tool.
#
#   kind create cluster --name eventreg --config k8s/kind-cluster.yaml
#
# TWO WORKERS deliberately: with one node you can't observe the SCHEDULER doing
# anything, and "pods are placed across nodes" stays theoretical. With two you
# can watch replicas land on different nodes and see what happens when one is
# drained.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eventreg
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Labels this node so the ingress-nginx controller (which requires the
      # label) will schedule here.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Maps host port -> node port, so localhost:8090 reaches the ingress
      # controller inside the cluster.
      #
      # This exists because kind has no cloud load balancer. `type:
      # LoadBalancer` would sit <pending> forever, since there's nothing to
      # provision one. Port mappings are kind's substitute for that missing
      # cloud integration.
      - containerPort: 80
        hostPort: 8090
        protocol: TCP
  - role: worker
  - role: worker

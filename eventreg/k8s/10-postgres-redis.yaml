# Stateful dependencies.
#
# NOTE: running databases in Kubernetes is a real decision with real trade-offs.
# In production most teams use a MANAGED database (RDS, Cloud SQL) because
# backups, failover and upgrades are genuinely hard, and Kubernetes gives you
# little help with them. This is here so the whole stack runs locally in one
# cluster — which is the right call for learning and the wrong call for prod.
#
# A production in-cluster database would use a StatefulSet (stable network
# identity, ordered rollout, per-pod persistent volumes) rather than the
# Deployment below.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: eventreg
spec:
  # ==================== SERVICE TYPES (interview) ========================
  #
  #   ClusterIP     (default) reachable only INSIDE the cluster. A stable
  #                 virtual IP + DNS name in front of a changing set of pods.
  #                 Use for everything internal — databases, internal APIs.
  #
  #   NodePort      opens the SAME high port (30000-32767) on EVERY node and
  #                 forwards it in. Crude but dependency-free; mostly used for
  #                 local clusters and as a building block for LoadBalancer.
  #
  #   LoadBalancer  asks the CLOUD PROVIDER for a real external load balancer
  #                 with a public IP. Costs money, one per Service — which is
  #                 exactly why Ingress exists (see 40-ingress.yaml).
  #
  # Postgres is ClusterIP: nothing outside the cluster should reach it.
  type: ClusterIP
  selector:
    app: postgres          # LABEL SELECTOR — see the note in the api manifest
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: eventreg
spec:
  replicas: 1              # NEVER scale this naively — two Postgres pods would
                           # be two independent databases, not a cluster.
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: eventgo
            - name: POSTGRES_DB
              value: eventgo
            - name: POSTGRES_PASSWORD
              # Pulled from the Secret rather than written here — the whole
              # point of having a Secret object.
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            # The kubectl equivalent of compose's pg_isready healthcheck. This
            # is what makes the API's initContainer wait meaningful.
            exec:
              command: ["pg_isready", "-U", "eventgo", "-d", "eventgo"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            # ============ REQUESTS vs LIMITS (concept) ==================
            # requests = what the SCHEDULER reserves when placing this pod.
            #            Too low and you get packed onto a busy node; too high
            #            and pods sit Pending because nothing has room.
            # limits   = the hard ceiling. Exceeding the MEMORY limit gets the
            #            container OOM-KILLED. Exceeding the CPU limit only
            #            THROTTLES it — CPU is compressible, memory isn't.
            #            That asymmetry is the thing people get wrong.
            requests:
              memory: "128Mi"
              cpu: "100m"        # 100 millicores = 0.1 of a core
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: eventreg
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: eventreg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "no"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "320Mi"    # above maxmemory 256mb, with headroom for
                                 # redis's own overhead — set the limit BELOW
                                 # maxmemory and you'd get OOM-killed instead
                                 # of evicting, which defeats the cache.
              cpu: "300m"

# docker-compose: the whole stack, one command.
#
#   docker compose up --build       start everything (build the API first)
#   docker compose up -d            start detached (in the background)
#   docker compose logs -f api      follow the API's logs
#   docker compose ps               what's running
#   docker compose down             stop and remove containers (KEEPS the volume)
#   docker compose down -v          ...and delete the database volume too
#
# Compose replaces the manual `docker run --name eventgo-pg -e ... -p ...`
# command from lesson 8. That worked, but it lived in your shell history. This
# file is checked into git, so the stack is reproducible by anyone who clones
# the repo — including you, on a new machine, in six months.

services:
  # ------------------------------------------------------------- postgres --
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventgo
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eventgo
    ports:
      # "host:container". Publishing 5432 is ONLY so you can reach the database
      # from your laptop (psql, a GUI client, `go run ./cmd/api` outside
      # Docker). The api service does NOT need this — see the networking note
      # below. In production you would remove this line entirely: an exposed
      # database port is an unnecessary attack surface.
      - "5432:5432"
    volumes:
      # NAMED VOLUME. A container's filesystem is ephemeral — delete the
      # container and its data is gone. A volume is storage managed by Docker
      # that OUTLIVES the container, which is what makes `docker compose down`
      # followed by `up` keep your data. (`down -v` deletes it deliberately.)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # HEALTHCHECK: a command Docker runs periodically to decide if this
      # service is not just RUNNING but actually READY.
      #
      # The distinction matters enormously here. Postgres accepts a TCP
      # connection a moment before it's ready to serve queries, so "the
      # container started" is NOT "the database works". pg_isready is the
      # official readiness probe.
      test: ["CMD-SHELL", "pg_isready -U eventgo -d eventgo"]
      interval: 5s
      timeout: 3s
      retries: 10
      # start_period: failures during this window don't count against retries,
      # giving a slow first boot room to initialise the data directory.
      start_period: 10s

  # ---------------------------------------------------------------- redis --
  redis:
    image: redis:7-alpine
    ports:
      # Same reasoning as postgres: published only so YOU can poke it with
      # redis-cli from the host. The api reaches it over the compose network.
      - "6379:6379"
    command: >
      redis-server
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # --appendonly no: we use Redis purely as a CACHE and lock store here, so
    #   there is nothing worth persisting. Every key is either regenerable from
    #   Postgres or intentionally short-lived. Disabling the append-only log
    #   removes disk I/O from the hot path.
    #
    # --maxmemory + allkeys-lru: THE setting people forget. Redis is IN-MEMORY;
    #   without a cap it will happily consume all the RAM on the box and get
    #   OOM-killed. With a cap and an eviction policy it stays bounded and drops
    #   the Least Recently Used keys when full — which is exactly the right
    #   behaviour for a cache, where losing a key just means a slower request.
    #   (If you were storing anything NOT regenerable, allkeys-lru would be
    #   dangerous — you'd want `noeviction` and to treat OOM as a real error.)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ api --
  #
  # TWO REPLICAS (lesson 19). api1 and api2 are IDENTICAL — same image, same
  # config, no shared memory. Nginx round-robins between them.
  #
  # WHY TWO NAMED SERVICES rather than `docker compose up --scale api=2`:
  # scaling gives all replicas the same DNS name, and nginx resolves an
  # `upstream server` entry ONCE at startup — so it would only ever see the
  # first IP and quietly send everything to one replica. Naming them explicitly
  # makes the upstream block real, and makes it obvious in logs which replica
  # served a request. (The `--scale` approach needs a `resolver` directive and
  # a variable in proxy_pass to force per-request DNS lookups.)
  #
  # NOTE: neither replica publishes a host port any more. They are reachable
  # ONLY through nginx, which is the point of a reverse proxy — one entry point,
  # backends invisible from outside.
  api1: &api-defaults
    build:
      context: .          # send this directory as the build context
      dockerfile: Dockerfile
    image: eventreg-api:local   # shared tag so the image is built once
    environment: &api-env
      # ---- THE NETWORKING LESSON ----
      # The host is `postgres` — the SERVICE NAME, not localhost, not an IP.
      #
      # Compose puts every service on a shared network with an internal DNS
      # server, so containers reach each other by service name. Docker resolves
      # `postgres` to whatever IP that container currently has, which is what
      # makes the setup survive restarts and rescheduling.
      #
      # WHY NOT localhost: inside a container, localhost is THAT CONTAINER.
      # `localhost:5432` from the api container means "port 5432 of the api
      # container" — nothing is listening there. This is the single most common
      # first-time Docker networking mistake.
      #
      # Note also the port is 5432, the CONTAINER's port. The "5432:5432"
      # mapping above is for your laptop; container-to-container traffic
      # doesn't go through it.
      DATABASE_URL: postgres://eventgo:secret@postgres:5432/eventgo?sslmode=disable

      # Same service-name DNS rule as postgres. Empty/unset disables caching
      # entirely — the app must work without Redis (see the explanation on
      # graceful degradation).
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: 30s

      # DELIBERATELY HIGH FOR LOCAL LOAD TESTING.
      #
      # A lesson learned the hard way: cmd/loadtest fires hundreds of requests
      # from ONE IP, so with the production-ish default (100/min) the limiter
      # correctly 429s your own test and you "discover" a bug that is actually
      # your defences working. Every load test must account for the rate limiter
      # — either raise it, or spread the load across source IPs.
      #
      # Production would use something like 100/1m here.
      RATE_LIMIT_REQUESTS: "100000"
      AUTH_RATE_LIMIT_REQUESTS: "100000"

      # gRPC target for the notification service — service-name DNS again.
      # Unset this and the API runs perfectly well with notifications disabled.
      NOTIFIER_ADDR: notifier:50051
      NOTIFIER_TIMEOUT: 2s

      # Everything below is lesson 14's config layer paying off: the image is
      # identical in every environment, and only these values change.
      APP_ENV: development
      PORT: "8082"
      LOG_FORMAT: json
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 15s

      # DEV ONLY. Real secrets belong in a .env file (gitignored) or a secrets
      # manager — never committed. Compose reads a sibling .env automatically,
      # so in a real setup this line would be:
      #     JWT_SECRET: ${JWT_SECRET}
      # ALL REPLICAS SHARE THE SAME SECRET. This is what makes JWTs work behind
      # a load balancer: a token minted by api1 must verify on api2. If each
      # replica generated its own secret, every other request would 401.
      JWT_SECRET: local-dev-secret-at-least-32-characters-long

      # Tells the app to trust X-Forwarded-For / X-Real-IP. ONLY safe because
      # nginx is the sole entry point and always overwrites them. Set this
      # without a proxy in front and any client can forge its IP to dodge the
      # rate limiter. See internal/config.
      TRUST_PROXY: "true"

    depends_on:
      postgres:
        # `depends_on` ALONE only waits for the container to START, not to be
        # usable — which for a database is nearly useless. `condition:
        # service_healthy` waits for the healthcheck above to pass.
        #
        # Without this, the API starts first, migrations fail to connect, and
        # the container exits. You'd see it "randomly" work depending on which
        # container won the race.
        condition: service_healthy
      redis:
        condition: service_healthy

    # Restart if the process exits unexpectedly, but NOT if we deliberately
    # stopped it. Handy while developing; in Kubernetes the scheduler owns this.
    restart: unless-stopped

  # The second replica. `<<: *api-defaults` is a YAML MERGE KEY — it splices in
  # everything anchored as &api-defaults above, so the two replicas cannot drift
  # apart. Copy-pasting the block would guarantee they eventually do.
  api2:
    <<: *api-defaults

  # ------------------------------------------------------------- notifier --
  #
  # The second SERVICE (lesson 20) — a separate process the API calls over
  # gRPC. Same image as the API (one Dockerfile, two binaries in cmd/), just a
  # different entrypoint.
  #
  # No host port published: nothing outside the network should speak to it, and
  # it isn't an HTTP service you'd curl anyway.
  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventreg-api:local
    # Override the image's ENTRYPOINT to run the other binary. This is why the
    # Dockerfile builds ./cmd/api by default but the source for both is present.
    entrypoint: ["/app/notifier"]
    environment:
      APP_ENV: development
      LOG_FORMAT: json
      LOG_LEVEL: info
      GRPC_PORT: "50051"
      SHUTDOWN_TIMEOUT: 15s
      JWT_SECRET: local-dev-secret-at-least-32-characters-long
    restart: unless-stopped

  # ---------------------------------------------------------------- nginx --
  nginx:
    image: nginx:1.27-alpine
    ports:
      # THE ONLY PUBLISHED PORT IN THE STACK now (besides the databases, which
      # are exposed purely for local debugging). Everything enters here.
      - "8080:80"
    volumes:
      # :ro — mount the config READ-ONLY. Nginx never needs to write it, and a
      # compromised container shouldn't be able to rewrite its own routing.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    # Plain depends_on is fine here: nginx starts happily with dead backends
    # and simply returns 502 until they answer. It doesn't need them READY the
    # way the API needs Postgres ready.
    healthcheck:
      # 127.0.0.1, NOT localhost. Inside alpine, `localhost` can resolve to ::1
      # first, and `listen 80;` binds IPv4 only — so the probe got "connection
      # refused" while the server was serving perfectly. A confusing way to mark
      # a healthy container unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

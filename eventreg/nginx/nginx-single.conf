# Single-replica variant of nginx.conf, used ONLY for the load-test A/B.
#
# Identical to nginx.conf in every respect except the upstream block, which
# lists one backend instead of two. Keeping it as a separate file (rather than
# just stopping api2) matters: with api2 stopped but still in the upstream,
# nginx would keep trying it, fail, and retry api1 via proxy_next_upstream —
# so the "1 replica" numbers would include failover cost and measure the wrong
# thing entirely.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format lb '$remote_addr -> $upstream_addr "$request" '
                  '$status ${upstream_response_time}s xff="$http_x_forwarded_for"';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    upstream eventreg_api {
        server api1:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
    gzip_proxied any;

    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_next_upstream error timeout http_502 http_503 http_504;

        location / {
            proxy_pass http://eventreg_api;
        }

        location = /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
        }
    }
}

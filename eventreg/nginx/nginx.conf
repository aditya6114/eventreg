# Nginx as a REVERSE PROXY and LOAD BALANCER in front of the API.
#
# ==================== FORWARD vs REVERSE PROXY (interview) ==================
#
# Both sit in the middle. The difference is WHOSE SIDE they're on:
#
#   FORWARD PROXY  — sits in front of CLIENTS, on their behalf.
#                    Your company's outbound proxy, a VPN, corporate filtering.
#                    The client knows it exists; the server doesn't.
#                    "Hide/represent the client from the internet."
#
#   REVERSE PROXY  — sits in front of SERVERS, on their behalf. (This file.)
#                    The client thinks it IS the server; the real backends are
#                    invisible.
#                    "Hide/represent the servers from the internet."
#
# One sentence: a forward proxy protects/serves the client, a reverse proxy
# protects/serves the server.
#
# WHAT A REVERSE PROXY BUYS YOU — every one of these matters here:
#   - LOAD BALANCING across replicas (the point of this lesson)
#   - ONE PUBLIC ENTRY POINT: the API containers need no published ports at all
#   - TLS TERMINATION: decrypt once at the edge, plain HTTP inside the network
#   - COMPRESSION, timeouts, buffering, static files, rate limiting at the edge
#   - ZERO-DOWNTIME DEPLOYS: drain one backend while the other serves

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logs go to stdout/stderr so `docker compose logs nginx` works — the same
    # 12-factor reasoning as the Go app's slog output (lesson 14).
    #
    # $upstream_addr is the field that matters for this lesson: it records WHICH
    # backend served each request, which is how you verify load balancing rather
    # than assuming it. Without it, "is round-robin working?" is unanswerable
    # from the proxy side.
    log_format lb '$remote_addr -> $upstream_addr "$request" '
                  '$status ${upstream_response_time}s xff="$http_x_forwarded_for"';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    # ======================= THE UPSTREAM BLOCK ============================
    #
    # A named pool of backend servers. `proxy_pass http://eventreg_api` below
    # points at this name rather than a single host.
    #
    # DEFAULT ALGORITHM IS ROUND-ROBIN: request 1 -> api1, request 2 -> api2,
    # request 3 -> api1... Even distribution, no state, nothing to configure.
    #
    # The alternatives, and when you'd want them:
    #   least_conn;   -> send to the backend with fewest ACTIVE connections.
    #                    Better when request durations vary a lot, since
    #                    round-robin can pile slow requests onto one box.
    #   ip_hash;      -> the same client IP always hits the same backend
    #                    ("sticky sessions"). This is what you need if your app
    #                    keeps SESSION STATE in memory — and precisely what we
    #                    DON'T need, because JWTs made us stateless. See the
    #                    note below.
    #   random two;   -> power-of-two-choices; good under high concurrency.
    upstream eventreg_api {
        server api1:8082 max_fails=3 fail_timeout=10s;
        server api2:8082 max_fails=3 fail_timeout=10s;

        # PASSIVE HEALTH CHECKING (the free version). After 3 failures within
        # fail_timeout, nginx marks that server down and stops sending traffic
        # for 10s, then retries. It's "passive" because nginx learns from real
        # requests failing rather than probing /health itself — ACTIVE health
        # checks are an nginx-plus (paid) feature. Kubernetes gives you active
        # probes for free in Week 4.

        # keepalive: reuse upstream TCP connections instead of opening a new
        # one per request. Without it, a busy proxy burns through ephemeral
        # ports and pays a TCP handshake on every single request.
        keepalive 32;
    }

    # ---------------------------------------------------------------- gzip --
    # Compress responses before sending. Our JSON event listings compress very
    # well (repetitive keys), often 70-80% smaller — a real win on mobile.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    # Don't bother below ~1KB: the CPU cost and the extra header outweigh the
    # saving, and tiny payloads sometimes get BIGGER.
    gzip_min_length 1024;
    gzip_proxied any;

    server {
        listen 80;

        # ==================== PROXY HEADERS (interview) ====================
        #
        # THE PROBLEM: once nginx is in front, the API's TCP peer is NGINX.
        # Every request appears to come from the proxy's IP. That silently
        # breaks anything IP-based:
        #   - our rate limiter would put ALL users in one bucket, so one
        #     abusive client throttles everybody (and 100 req/min becomes the
        #     limit for the entire internet)
        #   - audit logs would record the proxy for every action
        #   - geo-IP and abuse detection see one address
        #
        # THE FIX: nginx records the real client in headers the app can read.
        #
        #   X-Real-IP          the immediate client's IP, single value
        #   X-Forwarded-For    a comma-separated CHAIN, appended by each proxy:
        #                      "client, proxy1, proxy2". $proxy_add_x_forwarded_for
        #                      appends $remote_addr to whatever arrived.
        #   X-Forwarded-Proto  http or https — the app can't otherwise tell,
        #                      because TLS was terminated here. Needed to build
        #                      correct absolute URLs and to set Secure cookies.
        #   Host               preserve the ORIGINAL Host header; without this
        #                      the backend sees "eventreg_api" and any redirect
        #                      it generates points somewhere nobody can reach.
        #
        # ⚠️ SECURITY: these headers are CLIENT-SUPPLIED unless a trusted proxy
        # overwrites them. A client can send its own X-Forwarded-For to forge
        # an IP and bypass a rate limit. That's why the app must only trust
        # them when it knows it's behind a proxy it controls — see TRUST_PROXY
        # in internal/config.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 + clearing Connection is what makes upstream `keepalive`
        # work; nginx defaults to HTTP/1.0 upstream, which closes every
        # connection.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # -------------------------------------------------------- timeouts --
        # Without these, one hung backend can tie up proxy workers indefinitely
        # until nginx itself stops accepting connections. Bounding them turns a
        # slow backend into a fast 504 instead of a cascading failure.
        proxy_connect_timeout 5s;   # time to establish a TCP connection
        proxy_send_timeout    30s;  # time to send the request
        proxy_read_timeout    30s;  # time waiting for the response

        # Retry the OTHER upstream if this one refuses or dies mid-request.
        # NOTE: non_idempotent is deliberately NOT included — retrying a failed
        # POST could double-book a seat. (Our idempotency work would actually
        # make that safe, but relying on it silently would be a bad habit.)
        proxy_next_upstream error timeout http_502 http_503 http_504;

        location / {
            proxy_pass http://eventreg_api;
        }

        # A cheap edge health endpoint that does NOT touch the backends, so you
        # can tell "nginx is up" apart from "the API is up".
        location = /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
        }
    }

    # ==================== TLS TERMINATION (concept) ========================
    #
    # In production this server block would listen on 443 and hold the
    # certificate:
    #
    #   server {
    #       listen 443 ssl http2;
    #       ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #       ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #       ssl_protocols       TLSv1.2 TLSv1.3;
    #       location / { proxy_pass http://eventreg_api; }
    #   }
    #   # plus a :80 block that 301-redirects everything to https
    #
    # "TERMINATION" means TLS ENDS HERE: nginx decrypts, and traffic to the
    # backends is plain HTTP inside the private network.
    #
    # Why that's the normal design:
    #   - ONE place to install and renew certificates, instead of every replica
    #   - the backends skip TLS handshake CPU entirely
    #   - nginx has a hardened, well-audited TLS stack you don't have to
    #     reimplement in your app
    #
    # The trade-off: traffic between nginx and the app is unencrypted, which is
    # fine inside a private network and NOT fine across the public internet or
    # in a zero-trust environment (there you'd re-encrypt, or use a service
    # mesh with mTLS).
    #
    # Omitted here because local certs mean self-signed warnings that add
    # noise without teaching anything new.
}
